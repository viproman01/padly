# Padly — лендинг (Next.js static export, landing/out/) — /etc/nginx/sites-available/padly.
# Отдельно от myhonor.shop и других сайтов: каталог /var/www/padly, без приложения.
# Сертификат: certbot certonly --nginx --cert-name padly (продление — certbot.timer, после него reload nginx).
# Выкладка с мака: bash landing/deploy/vps/deploy.sh (rsync папки out/ в /var/www/padly).

server {
    listen 80;
    listen [::]:80;
    server_name padly.109-172-47-162.sslip.io;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Без http2 и ipv6only: параметры общего сокета 443 задаёт блок myhonor.shop
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name padly.109-172-47-162.sslip.io;

    ssl_certificate /etc/letsencrypt/live/padly/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/padly/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    root /var/www/padly;
    index index.html;
    error_page 404 /404.html;

    # Временный технический домен — в поиск не пускаем
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    access_log /var/log/nginx/padly.access.log;
    error_log /var/log/nginx/padly.error.log warn;

    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # trailingSlash: false — страницы лежат как <путь>.html (setup.html, faq.html, download.html).
    # HTML и RSC-данные (.txt) всегда перепроверяются: после выкладки старые чанки удаляются.
    location / {
        try_files $uri $uri.html $uri/ =404;
        expires -1;
    }

    # Файлы Next с хэшем в имени — кэш на год
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location ~ /\. {
        deny all;
    }
}
